<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e2e2df" />
    <script>
      // Apply the stored theme before first paint. Light is the default.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("ask-jev-theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="Yes, no, or it depends in about 100 milliseconds from Jev, TypeSafe's judgment model. Sign in and ask anything: Jev picks one of four models and a short answer streams through the Convex AI Gateway. Every ask lands on a realtime wall, counting to a million."
    />
    <title>Ask Jev anything, for real</title>
    <link rel="canonical" href="https://www.askjev.ai/" />

    <!-- Favicon. SVG first (crisp at any size), ICO for older browsers and
         some link previews, PNG for iOS home screen. All from public/favicon.svg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph. Image URLs must be absolute for X, Slack, iMessage, LinkedIn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ask Jev" />
    <meta property="og:title" content="Ask Jev anything, for real" />
    <meta
      property="og:description"
      content="Yes, no, or it depends in about 100 milliseconds from Jev, TypeSafe's judgment model. Sign in and ask anything: Jev picks one of four models and a short answer streams through the Convex AI Gateway. Every ask lands on a realtime wall, counting to a million."
    />
    <meta property="og:url" content="https://www.askjev.ai/" />
    <meta property="og:image" content="https://www.askjev.ai/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ask Jev anything. Heavy compressed headline on a warm limestone canvas. A pill input reading ask jev anything with an orange Ask button beside an orange panel showing the live count. Powered by Convex and TypeSafe."
    />
    <meta property="og:locale" content="en_US" />

    <!-- X. Large image card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ask Jev anything, for real" />
    <meta
      name="twitter:description"
      content="Yes, no, or it depends in about 100 milliseconds from Jev, TypeSafe's judgment model. Sign in and ask anything: Jev picks one of four models and a short answer streams through the Convex AI Gateway. Every ask lands on a realtime wall, counting to a million."
    />
    <meta name="twitter:image" content="https://www.askjev.ai/og.png" />
    <meta
      name="twitter:image:alt"
      content="Ask Jev anything. Heavy compressed headline on a warm limestone canvas. A pill input reading ask jev anything with an orange Ask button beside an orange panel showing the live count. Powered by Convex and TypeSafe."
    />
    <!-- Light: Archivo (compressed, heavy) for display, DM Sans medium for body,
         DM Mono for labels. Dark keeps Inter. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@400&family=DM+Sans:wght@500&display=swap"
    />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
